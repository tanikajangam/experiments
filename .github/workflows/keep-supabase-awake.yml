# Supabase pauses a free project after a week with no activity. This calls its REST API once a week so
# that never happens. Uses two repo secrets: SUPABASE_URL and SUPABASE_ANON_KEY (the public key).
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 9 * * 1' # Mondays, 09:17 UTC
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 10 \
            "$SUPABASE_URL/rest/v1/experiments?select=id&limit=1" -H "apikey: $SUPABASE_ANON_KEY")
          echo "Supabase answered HTTP $status"
          test "$status" = "200"
